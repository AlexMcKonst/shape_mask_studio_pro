    function applyTransform(ctxT, m, qs) {
        const cx = (m.startX || 0) * qs;
        const cy = (m.startY || 0) * qs;
        const ox = (m.offsetX || 0) * qs;
        const oy = (m.offsetY || 0) * qs;
        
        ctxT.translate(cx + ox, cy + oy);
        ctxT.rotate((m.rotation || 0) * Math.PI/180);
        
        const sx = (m.scale || 1) * (m.flipX ? -1 : 1);
        const sy = (m.scale || 1) * (m.flipY ? -1 : 1);
        ctxT.scale(sx, sy);
        
        ctxT.translate(-cx, -cy);
    }

    function getInversePoint(x, y, m) {
        const cx = m.startX;
        const cy = m.startY;
        const ox = m.offsetX || 0;
        const oy = m.offsetY || 0;
        
        let dx = x - (cx + ox);
        let dy = y - (cy + oy);
        
        const rad = -(m.rotation || 0) * Math.PI / 180;
        let rx = dx * Math.cos(rad) - dy * Math.sin(rad);
        let ry = dx * Math.sin(rad) + dy * Math.cos(rad);
        
        rx /= ((m.scale || 1) * (m.flipX ? -1 : 1)); 
        ry /= ((m.scale || 1) * (m.flipY ? -1 : 1));
        
        return { x: rx + cx, y: ry + cy };
    }
    
    function getBoundingBox(m, qs) {
        let minX = 0, minY = 0, maxX = 0, maxY = 0;
        
        if (m.type === 'text') {
            ctx.font = `bold ${100*qs}px system-ui`;
            const met = ctx.measureText(m.text);
            const w = met.width, h = 100*qs;
            minX = (m.startX * qs) - w/2; 
            maxX = (m.startX * qs) + w/2; 
            minY = (m.startY * qs) - h/2; 
            maxY = (m.startY * qs) + h/2;
        } else if (m.type === 'polygon' || m.type === 'freedraw') {
            if (m.points && m.points.length) {
                let pxs = m.points.map(p => p.x * qs);
                let pys = m.points.map(p => p.y * qs);
                minX = Math.min(...pxs); maxX = Math.max(...pxs);
                minY = Math.min(...pys); maxY = Math.max(...pys);
            }
        } else {
            minX = m.startX * qs; maxX = m.endX * qs;
            minY = m.startY * qs; maxY = m.endY * qs;
            
            if (maxX < minX) { let t = minX; minX = maxX; maxX = t; }
            if (maxY < minY) { let t = minY; minY = maxY; maxY = t; }
            
            if (m.type === 'circle') {
                const r = Math.hypot((m.endX - m.startX)*qs, (m.endY - m.startY)*qs);
                minX = (m.startX * qs) - r; maxX = (m.startX * qs) + r; 
                minY = (m.startY * qs) - r; maxY = (m.startY * qs) + r;
            }
        }
        
        const pad = 10 * qs;
        return { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad*2, h: (maxY - minY) + pad*2 };
    }

    function getAbsoluteAnchor(mask, parentMask, qs) {
        let cx = (mask.startX + (mask.offsetX || 0)) * qs;
        let cy = (mask.startY + (mask.offsetY || 0)) * qs;
        
        if (parentMask) {
            const pcx = (parentMask.startX + (parentMask.offsetX || 0)) * qs;
            const pcy = (parentMask.startY + (parentMask.offsetY || 0)) * qs;
            
            let dx = cx - pcx;
            let dy = cy - pcy;
            
            const rad = (parentMask.rotation || 0) * Math.PI / 180;
            const sx = (parentMask.scale || 1) * (parentMask.flipX ? -1 : 1);
            const sy = (parentMask.scale || 1) * (parentMask.flipY ? -1 : 1);
            
            let rx = dx * sx * Math.cos(rad) - dy * sy * Math.sin(rad);
            let ry = dx * sx * Math.sin(rad) + dy * sy * Math.cos(rad);
            
            cx = rx + pcx;
            cy = ry + pcy;
        }
        return { x: cx, y: cy };
    }

    function checkHandlesHit(lx, ly, bbox, qs) {
        const hr = 18 * qs; 
        
        if (Math.hypot(lx - bbox.x, ly - bbox.y) < hr) return 'scale';
        if (Math.hypot(lx - (bbox.x + bbox.w), ly - bbox.y) < hr) return 'scale';
        if (Math.hypot(lx - bbox.x, ly - (bbox.y + bbox.h)) < hr) return 'scale';
        if (Math.hypot(lx - (bbox.x + bbox.w), ly - (bbox.y + bbox.h)) < hr) return 'scale';
        
        if (Math.hypot(lx - (bbox.x + bbox.w/2), ly - bbox.y) < hr) return 'rotate';
        if (Math.hypot(lx - (bbox.x + bbox.w/2), ly - (bbox.y + bbox.h)) < hr) return 'rotate';
        if (Math.hypot(lx - bbox.x, ly - (bbox.y + bbox.h/2)) < hr) return 'rotate';
        if (Math.hypot(lx - (bbox.x + bbox.w), ly - (bbox.y + bbox.h/2)) < hr) return 'rotate';
        
        return null;
    }

    canvas.addEventListener('pointerdown', (e) => {
        if(!App.activeMediaId || e.target.closest('#floatingMenu') || e.target.closest('#editMaskToolbar') || e.target.closest('#panMediaToolbar')) return;
        canvas.setPointerCapture(e.pointerId);
        
        const rect = canvas.getBoundingClientRect();
        const ratioX = rect.width ? App.workW / rect.width : 1;
        const ratioY = rect.height ? App.workH / rect.height : 1;
        const x = (e.clientX - rect.left) * ratioX;
        const y = (e.clientY - rect.top) * ratioY;
        
        pointers.set(e.pointerId, { x, y });
        const qs = App.quality;

        if (App.mode === 'PAN_MEDIA') {
            if (selectedMask) {
                isDragging = true; dragStartX = x; dragStartY = y; transformAction = 'panMedia';
            }
            return;
        }

        if (App.mode === 'EDIT_MASK' && selectedMask) {
            if (pointers.size === 2 && selectedSubMask) {
                isDragging = false; isPinching = true; transformAction = null;
                const pts = Array.from(pointers.values());
                dragStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                initScale = selectedSubMask.scale || 1; initRot = selectedSubMask.rotation || 0;
                return;
            }

            const pt = getInversePoint(x, y, selectedMask); 
            
            if (App.activeTool === 'move') {
                let hitSub = null;
                if (selectedSubMask) {
                    const ptSub = getInversePoint(pt.x, pt.y, selectedSubMask);
                    const bbox = getBoundingBox(selectedSubMask, qs);
                    transformAction = checkHandlesHit(ptSub.x * qs, ptSub.y * qs, bbox, qs);
                    if (transformAction) { 
                        isDragging = true; dragStartX = x; dragStartY = y; 
                        const anchor = getAbsoluteAnchor(selectedSubMask, selectedMask, qs);
                        dragStartDist = Math.hypot(x - anchor.x, y - anchor.y);
                        dragStartAngle = Math.atan2(y - anchor.y, x - anchor.x);
                        initScale = selectedSubMask.scale || 1;
                        initRot = selectedSubMask.rotation || 0;
                        return; 
                    }
                }
                
                if (!transformAction && selectedMask.subShapes) {
                    for(let i = selectedMask.subShapes.length - 1; i >= 0; i--) {
                        const sub = selectedMask.subShapes[i];
                        ctx.save(); applyTransform(ctx, selectedMask, qs); applyTransform(ctx, sub, qs);
                        if (sub.type === 'text') {
                            ctx.font = `bold ${100*qs}px system-ui`;
                            const met = ctx.measureText(sub.text), h = 100*qs;
                            ctx.beginPath(); ctx.rect((sub.startX*qs) - met.width/2, (sub.startY*qs) - h/2, met.width, h);
                            if(ctx.isPointInPath(x*qs, y*qs)) hitSub = sub;
                        } else {
                            buildPath(ctx, sub, qs);
                            if (ctx.isPointInPath(x*qs, y*qs)) hitSub = sub;
                        }
                        ctx.restore();
                        if (hitSub) break;
                    }
                }
                
                selectedSubMask = hitSub;
                if (hitSub) { 
                    isDragging = true; dragStartX = x; dragStartY = y; transformAction = 'move'; 
                    if (hitSub.boolOp === 'subtract') document.getElementById('editOpSub').click();
                    else document.getElementById('editOpAdd').click();
                }
                return;
            }
            
            floatingMenu.classList.add('hidden');
            if(App.shape === 'polygon') {
                let hitIdx = -1;
                if(draftMask && draftMask.points) {
                    hitIdx = draftMask.points.findIndex(p => Math.hypot(pt.x - p.x, pt.y - p.y) < 12 / qs);
                }
                
                if (hitIdx > -1) {
                    draggedDraftPointIdx = hitIdx;
                } else {
                    if(!draftMask) {
                        saveUndo();
                        draftMask = createBaseMask(pt.x, pt.y); draftMask.points = [{x: pt.x, y: pt.y}];
                        draftMask.boolOp = App.editBoolOp;
                        document.getElementById('finishPolyBtn').classList.remove('hidden');
                        draggedDraftPointIdx = 0;
                    } else {
                        draftMask.points.push({x: pt.x, y: pt.y});
                        draggedDraftPointIdx = draftMask.points.length - 1;
                    }
                }
            } else if (App.shape === 'text') {
                showModal("Add Text", "Enter your text...", (val) => {
                    if(val) { saveUndo(); draftMask = createBaseMask(pt.x, pt.y); draftMask.text = val; draftMask.boolOp = App.editBoolOp; finishDraft(); }
                });
            } else {
                saveUndo(); draftMask = createBaseMask(pt.x, pt.y); draftMask.boolOp = App.editBoolOp;
                if(App.shape === 'freedraw') draftMask.points = [{x: pt.x, y: pt.y}];
            }
        } else if (App.mode === 'DRAWING') {
            floatingMenu.classList.add('hidden');
            if(App.shape === 'polygon') {
                let hitIdx = -1;
                if(draftMask && draftMask.points) {
                    hitIdx = draftMask.points.findIndex(p => Math.hypot(x - p.x, y - p.y) < 12 / qs);
                }
                
                if (hitIdx > -1) {
                    draggedDraftPointIdx = hitIdx;
                } else {
                    if(!draftMask) {
                        saveUndo(); draftMask = createBaseMask(x, y); draftMask.points = [{x, y}];
                        document.getElementById('finishPolyBtn').classList.remove('hidden');
                        draggedDraftPointIdx = 0;
                    } else {
                        draftMask.points.push({x, y});
                        draggedDraftPointIdx = draftMask.points.length - 1;
                    }
                }
            } else if (App.shape === 'text') {
                showModal("Add Text", "Enter your text...", (val) => {
                    if(val) { saveUndo(); draftMask = createBaseMask(x, y); draftMask.text = val; finishDraft(); }
                });
            } else if (App.shape === 'template') {
                if(App.templates.length) { saveUndo(); draftMask = createBaseMask(x, y); finishDraft(); }
            } else {
                saveUndo(); draftMask = createBaseMask(x, y);
                if(App.shape === 'freedraw') draftMask.points = [{x, y}];
            }
        } else if (App.mode === 'MOVING') {
            if(pointers.size === 1) {
                if (selectedMask) {
                    const pt = getInversePoint(x, y, selectedMask);
                    const bbox = getBoundingBox(selectedMask, qs);
                    transformAction = checkHandlesHit(pt.x * qs, pt.y * qs, bbox, qs);
                    if (transformAction) { 
                        isDragging = true; dragStartX = x; dragStartY = y; 
                        const anchor = getAbsoluteAnchor(selectedMask, null, qs);
                        dragStartDist = Math.hypot(x - anchor.x, y - anchor.y);
                        dragStartAngle = Math.atan2(y - anchor.y, x - anchor.x);
                        initScale = selectedMask.scale || 1;
                        initRot = selectedMask.rotation || 0;
                        return; 
                    }
                }

                const hit = findHitMask(x, y);
                if(hit) {
                    selectedMask = hit; isDragging = true; dragStartX = x; dragStartY = y; transformAction = 'move';
                    if (clickCount === 0) { clickCount = 1; clickTimer = setTimeout(() => { clickCount = 0; }, 250); floatingMenu.classList.add('hidden'); }
                    else if (clickCount === 1) { clickCount = 2; clearTimeout(clickTimer); clickTimer = setTimeout(() => { clickCount = 0; showMenu(x,y); }, 250); }
                    else if (clickCount === 2) { clickCount = 0; clearTimeout(clickTimer); handleTripleClick(hit); }
                } else { 
                    selectedMask = null; 
                    if(clickTimer) { clearTimeout(clickTimer); clickCount = 0; }
                    floatingMenu.classList.add('hidden'); 
                }
            } else if (pointers.size === 2 && selectedMask) {
                isDragging = false; isPinching = true; transformAction = null;
                const pts = Array.from(pointers.values());
                dragStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                const target = (App.mode === 'EDIT_MASK' && selectedSubMask) ? selectedSubMask : selectedMask;
                initScale = target.scale || 1; initRot = target.rotation || 0;
            }
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if(!pointers.has(e.pointerId)) return;
        const rect = canvas.getBoundingClientRect();
        
        const ratioX = rect.width ? App.workW / rect.width : 1;
        const ratioY = rect.height ? App.workH / rect.height : 1;
        const x = (e.clientX - rect.left) * ratioX;
        const y = (e.clientY - rect.top) * ratioY;
        
        pointers.get(e.pointerId).x = x; pointers.get(e.pointerId).y = y;
        
        const qs = App.quality;

        if (draggedDraftPointIdx > -1 && draftMask && draftMask.points) {
            if (App.mode === 'EDIT_MASK' && selectedMask) {
                const pt = getInversePoint(x, y, selectedMask);
                draftMask.points[draggedDraftPointIdx].x = pt.x;
                draftMask.points[draggedDraftPointIdx].y = pt.y;
            } else {
                draftMask.points[draggedDraftPointIdx].x = x;
                draftMask.points[draggedDraftPointIdx].y = y;
            }
        } else if(App.mode === 'EDIT_MASK' && App.activeTool === 'draw' && draftMask && App.shape !== 'polygon' && App.shape !== 'text' && App.shape !== 'template') {
            const pt = getInversePoint(x, y, selectedMask);
            if(App.shape === 'freedraw') draftMask.points.push({x: pt.x, y: pt.y});
            else { draftMask.endX = pt.x; draftMask.endY = pt.y; }
        } else if (App.mode === 'DRAWING' && draftMask && App.shape !== 'polygon' && App.shape !== 'text' && App.shape !== 'template') {
            if(App.shape === 'freedraw') draftMask.points.push({x, y});
            else { draftMask.endX = x; draftMask.endY = y; }
        } else if (App.mode === 'PAN_MEDIA' && selectedMask && isDragging) {
            let mx = x - dragStartX, my = y - dragStartY;
            const rad = -(selectedMask.rotation || 0) * Math.PI / 180;
            const pScale = selectedMask.scale || 1;
            let rx = (mx * Math.cos(rad) - my * Math.sin(rad)) / pScale;
            let ry = (mx * Math.sin(rad) + my * Math.cos(rad)) / pScale;
            
            selectedMask.mediaOffsetX = (selectedMask.mediaOffsetX || 0) + rx * (selectedMask.flipX ? -1 : 1);
            selectedMask.mediaOffsetY = (selectedMask.mediaOffsetY || 0) + ry * (selectedMask.flipY ? -1 : 1);
            dragStartX = x; dragStartY = y;
        } else if ((App.mode === 'MOVING' || (App.mode === 'EDIT_MASK' && App.activeTool === 'move')) && (selectedMask || selectedSubMask)) {
            const target = (App.mode === 'EDIT_MASK' && selectedSubMask) ? selectedSubMask : selectedMask;
            
            if(isPinching && pointers.size === 2) {
                const pts = Array.from(pointers.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                target.scale = Math.max(0.1, initScale * (dist / dragStartDist));
            } else if(isDragging && pointers.size === 1) {
                if (transformAction === 'scale') {
                    const anchor = getAbsoluteAnchor(target, target === selectedSubMask ? selectedMask : null, qs);
                    const currentDist = Math.hypot(x - anchor.x, y - anchor.y);
                    if (dragStartDist > 5) {
                        target.scale = Math.max(0.1, initScale * (currentDist / dragStartDist));
                    }
                } else if (transformAction === 'rotate') {
                    const anchor = getAbsoluteAnchor(target, target === selectedSubMask ? selectedMask : null, qs);
                    const currentAngle = Math.atan2(y - anchor.y, x - anchor.x);
                    target.rotation = initRot + (currentAngle - dragStartAngle) * (180 / Math.PI);
                } else if (transformAction === 'move') {
                    let mx = x - dragStartX, my = y - dragStartY;
                    if (target === selectedSubMask) {
                        const rad = -(selectedMask.rotation || 0) * Math.PI / 180;
                        const pScale = selectedMask.scale || 1;
                        let rx = (mx * Math.cos(rad) - my * Math.sin(rad)) / pScale;
                        let ry = (mx * Math.sin(rad) + my * Math.cos(rad)) / pScale;
                        mx = rx; my = ry;
                    }
                    target.offsetX += mx; target.offsetY += my;
                    dragStartX = x; dragStartY = y;
                }
            }
        }
    });

    canvas.addEventListener('pointerup', (e) => {
        pointers.delete(e.pointerId);
        draggedDraftPointIdx = -1;
        if((App.mode === 'DRAWING' || (App.mode === 'EDIT_MASK' && App.activeTool === 'draw')) && draftMask && App.shape !== 'polygon' && App.shape !== 'text' && App.shape !== 'template') finishDraft();
        if(pointers.size < 2) isPinching = false;
        if(pointers.size === 0) { isDragging = false; transformAction = null; }
    });

    document.getElementById('finishPolyBtn').onclick = () => { if(draftMask && draftMask.points && draftMask.points.length > 2) finishDraft(); };

    function createBaseMask(x,y) {
        if(App.shape === 'template' && App.templates.length) {
            const tpl = JSON.parse(JSON.stringify(App.templates[App.templates.length-1]));
            tpl.id = Date.now();
            tpl.mediaId = App.activeMediaId;
            const dx = x - tpl.startX;
            const dy = y - tpl.startY;
            tpl.offsetX += dx; tpl.offsetY += dy;
            return tpl;
        }
        const m = { 
            id: Date.now(), type: App.shape, mediaId: App.activeMediaId, 
            startX: x, startY: y, endX: x, endY: y, offsetX: 0, offsetY: 0, 
            mediaOffsetX: 0, mediaOffsetY: 0, mediaScale: 1,
            scale: 1, rotation: 0, flipX: false, flipY: false, points: [], text: '', boolOp: 'normal',
            strokeWidth: 0, strokeColor: '#ffffff', strokeOrder: 'outer'
        };
        if (App.shape === 'svg_mask') m.svgId = App.activeSvgId;
        return m;
    }

    function finishDraft() {
        if (draftMask && (draftMask.type === 'polygon' || draftMask.type === 'freedraw')) {
            if (draftMask.points && draftMask.points.length > 0) {
                let minX = Math.min(...draftMask.points.map(p => p.x));
                let maxX = Math.max(...draftMask.points.map(p => p.x));
                let minY = Math.min(...draftMask.points.map(p => p.y));
                let maxY = Math.max(...draftMask.points.map(p => p.y));
                draftMask.startX = minX + (maxX - minX) / 2;
                draftMask.startY = minY + (maxY - minY) / 2;
            }
        }

        if (App.mode === 'EDIT_MASK' && selectedMask) {
            if(!selectedMask.subShapes) selectedMask.subShapes = [];
            selectedMask.subShapes.push(JSON.parse(JSON.stringify(draftMask)));
            selectedSubMask = selectedMask.subShapes[selectedMask.subShapes.length - 1];
            draftMask = null;
            document.getElementById('finishPolyBtn').classList.add('hidden');
        } else {
            let finalMask = JSON.parse(JSON.stringify(draftMask));
            const src = App.mediaList.find(x => x.id === finalMask.mediaId);
            if(src) finalMask.clonedMedia = cloneMediaToDOM(src.element, src.type);
            masks.push(finalMask);
            draftMask = null;
            document.getElementById('finishPolyBtn').classList.add('hidden');
            setMode('MOVING');
        }
    }

    function handleTripleClick(m) {
        const f = document.getElementById('flashOverlay'); f.classList.remove('hidden'); f.classList.add('flash-anim');
        setTimeout(() => { f.classList.remove('flash-anim'); f.classList.add('hidden'); }, 300);
        saveUndo();
        const clone = JSON.parse(JSON.stringify(m));
        clone.id = Date.now(); clone.offsetX += 40; clone.offsetY += 40;
        const src = App.mediaList.find(x => x.id === m.mediaId);
        if(src) clone.clonedMedia = cloneMediaToDOM(src.element, src.type);
        masks.push(clone);
    }

    function buildPath(ctxT, m, qs) {
        const sx = m.startX * qs;
        const sy = m.startY * qs;
        ctxT.beginPath();
        if(m.type === 'square') { ctxT.rect(sx, sy, (m.endX-m.startX)*qs, (m.endY-m.startY)*qs); }
        else if(m.type === 'circle') { ctxT.arc(sx, sy, Math.hypot((m.endX-m.startX)*qs, (m.endY-m.startY)*qs), 0, Math.PI*2); }
        else if(m.type === 'triangle') { 
            const w = (m.endX-m.startX)*qs, h = (m.endY-m.startY)*qs;
            ctxT.moveTo(sx + w/2, sy); ctxT.lineTo(sx + w, sy + h); ctxT.lineTo(sx, sy + h); ctxT.closePath();
        }
        else if(m.type === 'polygon' || m.type === 'freedraw') {
            if(m.points && m.points.length) {
                ctxT.moveTo(m.points[0].x*qs, m.points[0].y*qs);
                for(let i=1; i<m.points.length; i++) ctxT.lineTo(m.points[i].x*qs, m.points[i].y*qs);
                if(m.type === 'polygon') ctxT.closePath();
            }
        }
    }

    function findHitMask(x,y) {
        const qs = App.quality;
        for(let i=masks.length-1; i>=0; i--) {
            const m = masks[i]; 
            ctx.save(); applyTransform(ctx, m, qs);
            let hit = false;
            
            if(m.type === 'text') {
                ctx.font = `bold ${100*qs}px system-ui`;
                const met = ctx.measureText(m.text), h = 100*qs;
                ctx.beginPath(); ctx.rect((m.startX*qs) - met.width/2, (m.startY*qs) - h/2, met.width, h);
                if(ctx.isPointInPath(x*qs, y*qs)) hit = true;
            } else if (m.type === 'svg_mask') {
                ctx.beginPath(); ctx.rect(m.startX*qs, m.startY*qs, (m.endX-m.startX)*qs, (m.endY-m.startY)*qs);
                if(ctx.isPointInPath(x*qs, y*qs)) hit = true;
            } else { 
                buildPath(ctx, m, qs); if(ctx.isPointInPath(x*qs, y*qs)) hit = true; 
            }
            
            if(m.subShapes) {
                for(let sub of m.subShapes) {
                    ctx.save(); applyTransform(ctx, sub, qs);
                    if(sub.type === 'text') {
                        ctx.font = `bold ${100*qs}px system-ui`;
                        const met = ctx.measureText(sub.text), h = 100*qs;
                        ctx.beginPath(); ctx.rect((sub.startX*qs) - met.width/2, (sub.startY*qs) - h/2, met.width, h);
                        if(ctx.isPointInPath(x*qs, y*qs)) hit = true;
                    } else if (sub.type === 'svg_mask') {
                        ctx.beginPath(); ctx.rect(sub.startX*qs, sub.startY*qs, (sub.endX-sub.startX)*qs, (sub.endY-sub.startY)*qs);
                        if(ctx.isPointInPath(x*qs, y*qs)) hit = true;
                    } else {
                        buildPath(ctx, sub, qs); if(ctx.isPointInPath(x*qs, y*qs)) hit = true;
                    }
                    ctx.restore();
                }
            }
            ctx.restore();
            if (hit) return m;
        } 
        return null;
    }

    function showMenu(x,y) {
        if (!selectedMask) return;
        const rect = canvas.getBoundingClientRect();
        let screenX = (x / App.workW) * rect.width;
        let screenY = (y / App.workH) * rect.height;
        
        floatingMenu.style.left = `${Math.min(screenX + 50, canvasWrapper.clientWidth - 260)}px`;
        floatingMenu.style.top = `${Math.min(screenY + 50, canvasWrapper.clientHeight - 200)}px`;
        floatingMenu.classList.remove('hidden');
        
        document.getElementById('strokeColorPicker').value = selectedMask.strokeColor || '#ffffff';
        document.getElementById('strokeWidthSlider').value = selectedMask.strokeWidth || 0;
        document.getElementById('strokeWidthVal').innerText = selectedMask.strokeWidth || 0;
        
        const strokeOrder = selectedMask.strokeOrder || 'outer';
        let strokeOrderText = '🔲 Outer';
        if (strokeOrder === 'inner') strokeOrderText = '🔳 Inner';
        if (strokeOrder === 'center') strokeOrderText = '〰️ Center';
        document.getElementById('strokeOrderBtn').innerText = strokeOrderText;

        if (selectedMask.type === 'text') {
            document.getElementById('editTextBtn').classList.remove('hidden');
        } else {
            document.getElementById('editTextBtn').classList.add('hidden');
        }

        const isVid = selectedMask.clonedMedia && selectedMask.clonedMedia.tagName === 'VIDEO';
        document.getElementById('videoControls').style.display = isVid ? 'flex' : 'none';
        if(isVid) {
            document.getElementById('speedSlider').value = selectedMask.clonedMedia.playbackRate;
            document.getElementById('speedVal').innerText = selectedMask.clonedMedia.playbackRate.toFixed(1) + 'x';
            document.getElementById('speedSlider').oninput = e => { selectedMask.clonedMedia.playbackRate = e.target.value; document.getElementById('speedVal').innerText = e.target.value + 'x'; };
            document.getElementById('maskPlayPauseBtn').innerText = selectedMask.clonedMedia.paused ? '▶️' : '⏸️';
        }
    }

    document.getElementById('maskPlayPauseBtn').onclick = function() {
        if (selectedMask && selectedMask.clonedMedia && selectedMask.clonedMedia.tagName === 'VIDEO') {
            if (selectedMask.clonedMedia.paused) {
                selectedMask.clonedMedia.play();
                this.innerText = '⏸️';
            } else {
                selectedMask.clonedMedia.pause();
                this.innerText = '▶️';
            }
        }
    };

    document.getElementById('editTextBtn').onclick = () => {
        if (selectedMask && selectedMask.type === 'text') {
            showModal("Edit Text", selectedMask.text, (val) => {
                if (val) {
                    saveUndo();
                    selectedMask.text = val;
                }
            });
        }
    };
    
    document.getElementById('strokeOrderBtn').onclick = function() {
        if(selectedMask) {
            saveUndo();
            const order = selectedMask.strokeOrder || 'outer';
            if (order === 'outer') selectedMask.strokeOrder = 'inner';
            else if (order === 'inner') selectedMask.strokeOrder = 'center';
            else selectedMask.strokeOrder = 'outer';
            
            const newOrder = selectedMask.strokeOrder;
            let strokeOrderText = '🔲 Outer';
            if (newOrder === 'inner') strokeOrderText = '🔳 Inner';
            if (newOrder === 'center') strokeOrderText = '〰️ Center';
            this.innerText = strokeOrderText;
        }
    };

    document.getElementById('closeMenuBtn').onclick = (e) => { e.stopPropagation(); floatingMenu.classList.add('hidden'); };
    document.getElementById('deleteMaskBtn').onclick = () => { if(selectedMask) masks = masks.filter(x => x !== selectedMask); selectedMask = null; floatingMenu.classList.add('hidden'); };
    document.getElementById('layerUpBtn').onclick = () => { if(selectedMask) { const i = masks.indexOf(selectedMask); if(i < masks.length-1) { masks.splice(i,1); masks.splice(i+1, 0, selectedMask); }}};
    document.getElementById('layerDownBtn').onclick = () => { if(selectedMask) { const i = masks.indexOf(selectedMask); if(i > 0) { masks.splice(i,1); masks.splice(i-1, 0, selectedMask); }}};
    
    document.getElementById('flipXBtn').onclick = () => { if(selectedMask) { saveUndo(); selectedMask.flipX = !selectedMask.flipX; } };
    document.getElementById('flipYBtn').onclick = () => { if(selectedMask) { saveUndo(); selectedMask.flipY = !selectedMask.flipY; } };

    document.getElementById('strokeColorPicker').oninput = (e) => {
        if(selectedMask) selectedMask.strokeColor = e.target.value;
    };
    document.getElementById('strokeWidthSlider').oninput = (e) => {
        if(selectedMask) {
            selectedMask.strokeWidth = parseInt(e.target.value);
            document.getElementById('strokeWidthVal').innerText = e.target.value;
        }
    };

    document.getElementById('panMediaBtn').onclick = () => {
        floatingMenu.classList.add('hidden');
        setMode('PAN_MEDIA');
        document.getElementById('panMediaToolbar').classList.remove('hidden');
        document.getElementById('mediaScaleSlider').value = selectedMask.mediaScale || 1;
    };
    
    document.getElementById('mediaScaleSlider').oninput = (e) => {
        if(selectedMask) selectedMask.mediaScale = parseFloat(e.target.value);
    };

    document.getElementById('panFinishBtn').onclick = () => { 
        setMode('MOVING'); 
        document.getElementById('panMediaToolbar').classList.add('hidden'); 
    };

    document.getElementById('editMaskBtn').onclick = () => {
        floatingMenu.classList.add('hidden');
        setMode('EDIT_MASK');
        App.activeTool = 'draw'; 
        updateToolUI();
        document.getElementById('editMaskToolbar').classList.remove('hidden');
        document.getElementById('editOpSub').click(); 
    };
    
    document.getElementById('editOpAdd').onclick = function() {
        App.editBoolOp = 'add';
        this.classList.replace('bg-neutral-800', 'bg-blue-600'); this.classList.replace('text-neutral-400', 'text-white');
        document.getElementById('editOpSub').classList.replace('bg-red-600', 'bg-neutral-800'); document.getElementById('editOpSub').classList.replace('text-white', 'text-neutral-400');
        if (App.mode === 'EDIT_MASK' && selectedSubMask) selectedSubMask.boolOp = 'add';
    };
    
    document.getElementById('editOpSub').onclick = function() {
        App.editBoolOp = 'subtract';
        this.classList.replace('bg-neutral-800', 'bg-red-600'); this.classList.replace('text-neutral-400', 'text-white');
        document.getElementById('editOpAdd').classList.replace('bg-blue-600', 'bg-neutral-800'); document.getElementById('editOpAdd').classList.replace('text-white', 'text-neutral-400');
        if (App.mode === 'EDIT_MASK' && selectedSubMask) selectedSubMask.boolOp = 'subtract';
    };

    document.getElementById('editOpDel').onclick = function() {
        if (selectedMask && selectedSubMask) {
            saveUndo();
            selectedMask.subShapes = selectedMask.subShapes.filter(s => s !== selectedSubMask);
            selectedSubMask = null;
        }
    };
    
    document.getElementById('editFinishBtn').onclick = () => { 
        if (draftMask && draftMask.points && draftMask.points.length > 2) {
            finishDraft();
        }
        draftMask = null;
        draggedDraftPointIdx = -1;
        
        setMode('MOVING', true);
        
        selectedSubMask = null; 
        document.getElementById('editMaskToolbar').classList.add('hidden');
        document.getElementById('finishPolyBtn').classList.add('hidden');
        floatingMenu.classList.add('hidden');
    };

    document.getElementById('saveTemplateBtn').onclick = () => {
        if(selectedMask) showModal("Name Template", "My Shape", (name) => { 
            if(name) {
                const template = JSON.parse(JSON.stringify(selectedMask));
                delete template.clonedMedia; 
                template.name = name;
                App.templates.push(template); 
                localStorage.setItem('sms_templates', JSON.stringify(App.templates));
                floatingMenu.classList.add('hidden');
                
                showAlert("Template Saved!", "Ваш шаблон успешно сохранен во внутреннюю память браузера.\n\nВы можете найти его в любое время, выбрав инструмент 🧩 (Templates) на правой панели.");
            } 
        });
    };

    function drawMediaSafe(ctxTarget, el, x, y, w, h) {
        if(!el) return false;
        try {
            if(el.tagName === 'VIDEO' && el.readyState < 2) return false; 
            if(el.tagName === 'IMG' && (!el.complete || !el.naturalWidth)) return false; 
            if(w !== undefined && h !== undefined) ctxTarget.drawImage(el, x, y, w, h);
            else ctxTarget.drawImage(el, x, y);
            return true;
        } catch(e) { return false; }
    }

    function drawContourStroke(ctxTarget, img, x, y, w, h, color, width) {
        if(!img || width <= 0) return;
        const pad = width * 2;
        contourCanvas.width = w + pad * 2; 
        contourCanvas.height = h + pad * 2;
        contourCtx.clearRect(0,0, contourCanvas.width, contourCanvas.height);
        
        // Optimized: Reduced number of steps for UI overlays
        const steps = 8;
        for(let i=0; i<steps; i++) {
            const angle = (i / steps) * Math.PI * 2;
            const ox = Math.cos(angle) * width;
            const oy = Math.sin(angle) * width;
            contourCtx.drawImage(img, pad + ox, pad + oy, w, h);
        }
        
        contourCtx.globalCompositeOperation = 'source-in';
        contourCtx.fillStyle = color;
        contourCtx.fillRect(0,0, contourCanvas.width, contourCanvas.height);
        
        contourCtx.globalCompositeOperation = 'destination-out';
        contourCtx.drawImage(img, pad, pad, w, h);
        
        contourCtx.globalCompositeOperation = 'source-over';
        ctxTarget.drawImage(contourCanvas, x - pad, y - pad);
    }

    function render(ctxTarget, qs, w, h, isExport) {
        if (!w || !h || w === 0 || h === 0) return;
        ctxTarget.clearRect(0, 0, w, h);
        
        if(App.bgMediaId) { 
            const bg = App.mediaList.find(x=>x.id===App.bgMediaId); 
            if(bg&&bg.element) drawMediaSafe(ctxTarget, bg.element, 0, 0, w, h); 
        }

        if(!isExport && App.activeTool === 'draw' && App.activeMediaId && App.activeMediaId !== App.bgMediaId) {
            const act = App.mediaList.find(x=>x.id===App.activeMediaId);
            if(act && act.element) {
                ctxTarget.save();
                ctxTarget.globalAlpha = 0.4;
                drawMediaSafe(ctxTarget, act.element, 0, 0, w, h);
                ctxTarget.restore();
            }
        }

        const lCv = isExport ? exportLayerCanvas : previewLayerCanvas;
        const lCtx = lCv.getContext('2d');
        lCtx.clearRect(0, 0, w, h);

        const mBuf = isExport ? exportMaskBuffer : maskBuffer;
        const mCtx = isExport ? exportMaskCtx : maskCtx;

        masks.forEach(m => {
            if(!m.clonedMedia) return;

            mBuf.width = mBuf.width; 
            mCtx.clearRect(0,0,w,h);
            
            mCtx.save();
            applyTransform(mCtx, m, qs);
            
            mCtx.fillStyle = '#fff';
            mCtx.beginPath();
            if(m.type === 'text') {
                mCtx.font = `bold ${100*qs}px system-ui`; mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
                mCtx.fillText(m.text, m.startX*qs, m.startY*qs);
            } else if (m.type === 'svg_mask') {
                const svgItem = App.svgMasks.find(s => s.id === m.svgId);
                if(svgItem) mCtx.drawImage(svgItem.img, m.startX*qs, m.startY*qs, (m.endX-m.startX)*qs, (m.endY-m.startY)*qs);
            } else {
                buildPath(mCtx, m, qs);
                mCtx.fill();
            }

            if(m.subShapes) {
                m.subShapes.forEach(sub => {
                    mCtx.save();
                    applyTransform(mCtx, sub, qs);
                    mCtx.globalCompositeOperation = sub.boolOp === 'subtract' ? 'destination-out' : 'source-over';
                    mCtx.fillStyle = sub.boolOp === 'subtract' ? '#000' : '#fff';
                    mCtx.beginPath();
                    if(sub.type === 'text') {
                        mCtx.font = `bold ${100*qs}px system-ui`; mCtx.textAlign = 'center'; mCtx.textBaseline = 'middle';
                        mCtx.fillText(sub.text, (sub.startX*qs), (sub.startY*qs));
                    } else if (sub.type === 'svg_mask') {
                        const svgItem = App.svgMasks.find(s => s.id === sub.svgId);
                        if(svgItem) mCtx.drawImage(svgItem.img, sub.startX*qs, sub.startY*qs, (sub.endX-sub.startX)*qs, (sub.endY-sub.startY)*qs);
                    } else {
                        buildPath(mCtx, sub, qs);
                        mCtx.fill();
                    }
                    mCtx.restore();
                });
            }
            
            mCtx.restore();

            let drawStrokeFront = false;
            if (m.strokeWidth > 0) {
                contourCanvas.width = w; contourCanvas.height = h;
                contourCtx.clearRect(0, 0, w, h);
                contourBgCanvas.width = w; contourBgCanvas.height = h;
                contourBgCtx.clearRect(0, 0, w, h);
                
                const sw = m.strokeWidth * qs;
                // Optimized: Tied rendering steps to App.quality to save CPU on LQ modes
                const steps = Math.max(4, Math.floor((sw > 15 ? 16 : 8) * (isExport ? 1.0 : qs))); 
                const strokeOrder = m.strokeOrder || 'outer';
                
                // Outer part of the stroke (drawn behind the mask)
                if (strokeOrder === 'outer' || strokeOrder === 'center') {
                    const currentSw = strokeOrder === 'center' ? sw / 2 : sw;
                    contourBgCtx.globalCompositeOperation = 'source-over';
                    for(let i=0; i<steps; i++) {
                        const angle = (i / steps) * Math.PI * 2;
                        contourBgCtx.drawImage(mBuf, Math.cos(angle)*currentSw, Math.sin(angle)*currentSw);
                    }
                    contourBgCtx.globalCompositeOperation = 'source-in';
                    contourBgCtx.fillStyle = m.strokeColor || '#ffffff';
                    contourBgCtx.fillRect(0, 0, w, h);
                    
                    contourBgCtx.globalCompositeOperation = 'destination-out';
                    contourBgCtx.drawImage(mBuf, 0, 0);
                    contourBgCtx.globalCompositeOperation = 'source-over';
                    
                    lCtx.drawImage(contourBgCanvas, 0, 0);
                }

                // Inner part of the stroke (drawn on top of the mask)
                if (strokeOrder === 'inner' || strokeOrder === 'center') {
                    const currentSw = strokeOrder === 'center' ? sw / 2 : sw;
                    drawStrokeFront = true;
                    
                    contourCtx.globalCompositeOperation = 'source-over';
                    contourCtx.drawImage(mBuf, 0, 0); // Original mask
                    
                    contourCtx.globalCompositeOperation = 'source-in';
                    for(let i=0; i<steps; i++) {
                        const angle = (i / steps) * Math.PI * 2;
                        contourCtx.drawImage(mBuf, Math.cos(angle)*currentSw, Math.sin(angle)*currentSw);
                    }
                    
                    // Now contourCtx has the SHRUNKEN mask. We subtract it from the Original mask.
                    contourCtx.globalCompositeOperation = 'source-out';
                    contourCtx.drawImage(mBuf, 0, 0);
                    
                    // Color it
                    contourCtx.globalCompositeOperation = 'source-in';
                    contourCtx.fillStyle = m.strokeColor || '#ffffff';
                    contourCtx.fillRect(0, 0, w, h);
                    contourCtx.globalCompositeOperation = 'source-over';
                }
            }

            // Fill mask with video
            mCtx.globalCompositeOperation = 'source-in';
            mCtx.save();
            
            // Apply mask transform so the video moves WITH the mask
            applyTransform(mCtx, m, qs);
            
            const mScale = m.mediaScale || 1;
            const maskCx = (m.startX || 0) * qs;
            const maskCy = (m.startY || 0) * qs;
            
            mCtx.translate(maskCx, maskCy);
            mCtx.scale(mScale, mScale);
            mCtx.translate(-maskCx, -maskCy);
            
            mCtx.translate((m.mediaOffsetX || 0) * qs, (m.mediaOffsetY || 0) * qs);
            
            const mediaDrawn = drawMediaSafe(mCtx, m.clonedMedia, 0, 0, w, h);
            mCtx.restore();
            
            if (!mediaDrawn) mCtx.clearRect(0,0,w,h);

            // Draw video to layer
            if (mBuf.width > 0 && mBuf.height > 0) lCtx.drawImage(mBuf, 0, 0); 
            
            // Draw inner stroke (Front) over the video
            if (drawStrokeFront && contourCanvas.width > 0) {
                lCtx.drawImage(contourCanvas, 0, 0);
            }
        });

        if (lCv.width > 0 && lCv.height > 0) ctxTarget.drawImage(lCv, 0, 0, w, h);
    }
    
    function drawHandles(ctxTarget, bbox, qs, color) {
        const s = 16 * qs; 
        const r = 8 * qs;  
        
        ctxTarget.lineWidth = 2 * qs;
        
        ctxTarget.fillStyle = '#10b981'; 
        ctxTarget.strokeStyle = '#ffffff';
        const edges = [
            {x: bbox.x + bbox.w/2, y: bbox.y},
            {x: bbox.x + bbox.w/2, y: bbox.y + bbox.h},
            {x: bbox.x, y: bbox.y + bbox.h/2},
            {x: bbox.x + bbox.w, y: bbox.y + bbox.h/2}
        ];
        edges.forEach(pt => {
            ctxTarget.beginPath(); ctxTarget.arc(pt.x, pt.y, r, 0, Math.PI*2); ctxTarget.fill(); ctxTarget.stroke();
        });
        
        ctxTarget.fillStyle = color; 
        ctxTarget.strokeStyle = '#ffffff';
        const corners = [
            {x: bbox.x, y: bbox.y}, {x: bbox.x + bbox.w, y: bbox.y},
            {x: bbox.x, y: bbox.y + bbox.h}, {x: bbox.x + bbox.w, y: bbox.y + bbox.h}
        ];
        corners.forEach(pt => {
            ctxTarget.fillRect(pt.x - s/2, pt.y - s/2, s, s);
            ctxTarget.strokeRect(pt.x - s/2, pt.y - s/2, s, s);
        });
    }

    function drawUIOverlays(ctxTarget, qs) {
        if(selectedMask) {
            ctxTarget.save(); 
            applyTransform(ctxTarget, selectedMask, qs);
            const bbox = getBoundingBox(selectedMask, qs);

            if (App.mode === 'MOVING') {
                ctxTarget.strokeStyle = 'rgba(255,255,255,0.5)'; ctxTarget.setLineDash([5*qs,5*qs]); ctxTarget.lineWidth = 2*qs;
                ctxTarget.strokeRect(bbox.x, bbox.y, bbox.w, bbox.h);
                ctxTarget.setLineDash([]);
                
                drawHandles(ctxTarget, bbox, qs, '#3b82f6');
            }

            ctxTarget.strokeStyle = '#3b82f6'; ctxTarget.lineWidth = 4*qs;
            ctxTarget.beginPath();
            if(selectedMask.type === 'text') {
                ctxTarget.font = `bold ${100*qs}px system-ui`; ctxTarget.textAlign = 'center'; ctxTarget.textBaseline = 'middle';
                ctxTarget.strokeText(selectedMask.text, selectedMask.startX*qs, selectedMask.startY*qs);
            } else if (selectedMask.type === 'svg_mask') {
                const svgItem = App.svgMasks.find(s => s.id === selectedMask.svgId);
                drawContourStroke(ctxTarget, svgItem?.img, selectedMask.startX*qs, selectedMask.startY*qs, (selectedMask.endX-selectedMask.startX)*qs, (selectedMask.endY-selectedMask.startY)*qs, '#3b82f6', 2*qs);
            } else { buildPath(ctxTarget, selectedMask, qs); ctxTarget.stroke(); }
            
            if(selectedMask.subShapes) {
                selectedMask.subShapes.forEach(sub => {
                    ctxTarget.save(); applyTransform(ctxTarget, sub, qs);
                    ctxTarget.strokeStyle = (App.mode === 'EDIT_MASK' && selectedSubMask === sub) ? '#fbbf24' : (sub.boolOp === 'subtract' ? '#ef4444' : '#10b981');
                    ctxTarget.lineWidth = (App.mode === 'EDIT_MASK' && selectedSubMask === sub) ? 4*qs : 2*qs;

                    if (App.mode === 'EDIT_MASK' && selectedSubMask === sub) {
                        const sBbox = getBoundingBox(sub, qs);
                        ctxTarget.strokeStyle = 'rgba(255,255,255,0.5)'; ctxTarget.setLineDash([5*qs,5*qs]); ctxTarget.lineWidth = 2*qs;
                        ctxTarget.strokeRect(sBbox.x, sBbox.y, sBbox.w, sBbox.h);
                        ctxTarget.setLineDash([]);

                        drawHandles(ctxTarget, sBbox, qs, '#fbbf24');
                        ctxTarget.strokeStyle = '#fbbf24'; ctxTarget.lineWidth = 4*qs;
                    }

                    ctxTarget.beginPath();
                    if(sub.type === 'text') {
                        ctxTarget.font = `bold ${100*qs}px system-ui`; ctxTarget.textAlign = 'center'; ctxTarget.textBaseline = 'middle';
                        ctxTarget.strokeText(sub.text, sub.startX*qs, sub.startY*qs);
                    } else if (sub.type === 'svg_mask') {
                        const svgItem = App.svgMasks.find(s => s.id === sub.svgId);
                        drawContourStroke(ctxTarget, svgItem?.img, sub.startX*qs, sub.startY*qs, (sub.endX-sub.startX)*qs, (sub.endY-sub.startY)*qs, ctxTarget.strokeStyle, ctxTarget.lineWidth/2);
                    } else { buildPath(ctxTarget, sub, qs); ctxTarget.stroke(); }
                    ctxTarget.restore();
                });
            }
            ctxTarget.restore();
        }

        if(draftMask) {
            ctxTarget.save(); 
            if(App.mode === 'EDIT_MASK' && selectedMask) {
                applyTransform(ctxTarget, selectedMask, qs);
                applyTransform(ctxTarget, draftMask, qs);
                ctxTarget.strokeStyle = draftMask.boolOp === 'subtract' ? '#ef4444' : '#10b981';
            } else {
                applyTransform(ctxTarget, draftMask, qs);
                ctxTarget.strokeStyle = '#fff';
            }
            
            ctxTarget.lineWidth = 3*qs; ctxTarget.setLineDash([8*qs,8*qs]); ctxTarget.beginPath();
            
            if(draftMask.type === 'text') {
                ctxTarget.font = `bold ${100*qs}px system-ui`; ctxTarget.textAlign = 'center'; ctxTarget.textBaseline = 'middle';
                ctxTarget.strokeText(draftMask.text, draftMask.startX*qs, draftMask.startY*qs);
            } else if (draftMask.type === 'svg_mask') {
                ctxTarget.strokeRect(draftMask.startX*qs, draftMask.startY*qs, (draftMask.endX-draftMask.startX)*qs, (draftMask.endY-draftMask.startY)*qs);
            } else {
                buildPath(ctxTarget, draftMask, qs);
                ctxTarget.stroke();
            }
            
            if (draftMask.type === 'polygon' && draftMask.points) {
                ctxTarget.setLineDash([]);
                ctxTarget.lineWidth = 2 * qs;
                draftMask.points.forEach((p, index) => {
                    ctxTarget.beginPath();
                    if (index === 0) {
                        ctxTarget.fillStyle = '#10b981';
                        ctxTarget.arc(p.x * qs, p.y * qs, 8 * qs, 0, Math.PI * 2);
                    } else {
                        ctxTarget.fillStyle = '#3b82f6';
                        ctxTarget.arc(p.x * qs, p.y * qs, 5 * qs, 0, Math.PI * 2);
                    }
                    ctxTarget.fill();
                    ctxTarget.stroke();
                });
            }
            
            ctxTarget.restore();
        }
    }

    // Optimized: FPS Limiter for Preview (Caps at 60fps to prevent 120/144hz monitor overload)
    let lastRenderTime = 0;
    let lastPreviewTime = 0;
    const maxPreviewFps = 60;
    const previewFpsInterval = 1000 / maxPreviewFps;
    const exportFpsInterval = 1000 / 30; 

    function loop(now) {
        requestAnimationFrame(loop);
        
        if (isRecording) {
            if (now - lastRenderTime < exportFpsInterval) return;
            lastRenderTime = now;
            
            render(exportCtx, 1.0, exportCanvas.width, exportCanvas.height, true);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(exportCanvas, 0, 0, canvas.width, canvas.height);
            drawUIOverlays(ctx, App.quality);
        } else {
            // Optimized: Prevent preview from rendering faster than 60fps
            if (now - lastPreviewTime < previewFpsInterval) return;
            lastPreviewTime = now;

            render(ctx, App.quality, canvas.width, canvas.height, false);
            drawUIOverlays(ctx, App.quality);
        }
    }

    let recordingTimeout = null;

    function stopRecording() {
        if (!isRecording || !mediaRecorder) return;
        mediaRecorder.stop(); 
        isRecording = false; 
        document.getElementById('recDot').classList.add('hidden');
        if (recordingTimeout) clearTimeout(recordingTimeout);
    }

    function startRecording(durationSeconds = 0) {
        if(isRecording) return;
        try {
            const stream = exportCanvas.captureStream(30);
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            const opts = { mimeType: isSafari ? 'video/mp4' : 'video/webm;codecs=vp8', videoBitsPerSecond: 8000000 };
            
            try { mediaRecorder = new MediaRecorder(stream, opts); } 
            catch(e) { mediaRecorder = new MediaRecorder(stream); }

            recordedChunks = [];
            mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const type = mediaRecorder.mimeType || 'video/webm';
                const ext = type.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(recordedChunks, { type });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
                a.download = `VJMix_${Date.now()}.${ext}`; a.click();
            };
            mediaRecorder.start(); 
            isRecording = true; 
            document.getElementById('recDot').classList.remove('hidden');

            if (durationSeconds > 0) {
                recordingTimeout = setTimeout(stopRecording, durationSeconds * 1000);
            }
        } catch(e) { console.error("Export Error:", e); }
    }

    document.getElementById('recordBtn').onclick = () => {
        if (isRecording) {
            stopRecording();
        } else {
            document.getElementById('exportModal').classList.remove('hidden');
        }
    };

    document.getElementById('exportCancel').onclick = () => document.getElementById('exportModal').classList.add('hidden');
    
    document.getElementById('recModeManual').onclick = () => {
        document.getElementById('exportModal').classList.add('hidden');
        startRecording(0);
    };

    document.getElementById('recModeBg').onclick = () => {
        document.getElementById('exportModal').classList.add('hidden');
        let dur = 0;
        if (App.bgMediaId) {
            const bg = App.mediaList.find(x => x.id === App.bgMediaId);
            if (bg && bg.element && bg.element.duration && bg.element.duration !== Infinity) dur = bg.element.duration;
        }
        if (dur > 0) {
            App.mediaList.forEach(m => {
                if (m.type === 'video' && m.element) m.element.currentTime = 0;
            });
            masks.forEach(m => {
                if (m.clonedMedia && m.clonedMedia.tagName === 'VIDEO') m.clonedMedia.currentTime = 0;
            });
            startRecording(dur);
        } else {
            showModal("Error", "No background video duration found.", () => {});
        }
    };

    document.getElementById('recModeCustom').onclick = () => {
        document.getElementById('exportModal').classList.add('hidden');
        showModal("Duration (sec)", "e.g. 15", (val) => {
            const dur = parseFloat(val);
            if (!isNaN(dur) && dur > 0) {
                startRecording(dur);
            }
        });
    };

    setTimeout(updateWorkspace, 100); 
    requestAnimationFrame(loop);
</script>
